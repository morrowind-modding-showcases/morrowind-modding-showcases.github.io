<style>
  :root {
    color-scheme: dark;
    --night: #0d0b08;
    --deep-night: #0a0806;
    --ink: #e8dfc8;
    --muted: #b8ad91;
    --gold: #d9bc7a;
    --gold-bright: #f0dca4;
    --line: rgba(217,188,122,.28);
    --panel: rgba(22,18,13,.92);
  }

  * { box-sizing: border-box; }

  html { background: var(--night); }

  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
  }

  a { color: var(--gold); }
  a:hover { color: var(--gold-bright); }
  ::selection { background: rgba(217,188,122,.3); }

  .site-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 50% 22%, rgba(101,74,32,.12), transparent 34rem),
      var(--night);
  }

  .hero {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(217,188,122,0.35);
  }

  .hero-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: saturate(0.9);
  }

  .hero-wash {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,11,8,0.55) 0%, rgba(13,11,8,0.35) 45%, rgba(13,11,8,0.92) 100%);
  }

  .hero-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 88px 24px 72px;
    text-align: center;
  }

  .hero-logo {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 3px rgba(217,188,122,0.5);
  }

  h1 {
    margin: 0;
    color: var(--gold-bright);
    font-family: Cinzel, Georgia, serif;
    font-size: clamp(34px, 5.5vw, 58px);
    font-weight: 700;
    letter-spacing: .06em;
    text-shadow: 0 2px 18px rgba(0,0,0,.9);
  }

  .hero-subtitle {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0;
    color: #cbbd97;
    font-size: 20px;
    font-style: italic;
    letter-spacing: .04em;
  }

  .hero-subtitle::before,
  .hero-subtitle::after {
    display: block;
    width: 64px;
    height: 1px;
    content: '';
    background: linear-gradient(90deg, transparent, rgba(217,188,122,.8));
  }

  .hero-subtitle::after {
    background: linear-gradient(270deg, transparent, rgba(217,188,122,.8));
  }

  main {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 24px 72px;
  }

  .resources-panel {
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 12px 38px rgba(0,0,0,.38);
  }

  .resource-tabs {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    overflow: hidden;
    border: 1px solid var(--line);
    border-bottom: 0;
    background: rgba(9,7,5,.92);
  }

  .resource-tab {
    min-height: 58px;
    padding: 12px 14px;
    border: 0;
    border-right: 1px solid var(--line);
    background: rgba(255,255,255,.015);
    color: #b8ad91;
    cursor: pointer;
    font-family: Cinzel, Georgia, serif;
    font-size: clamp(12px, 1.45vw, 15px);
    font-weight: 600;
    letter-spacing: .045em;
    line-height: 1.3;
    text-align: center;
    text-transform: uppercase;
    transition: background-color .16s ease, color .16s ease;
  }

  .resource-tab:last-child { border-right: 0; }

  .resource-tab:hover {
    background: rgba(217,188,122,.08);
    color: var(--gold-bright);
  }

  .resource-tab[aria-selected="true"] {
    background: linear-gradient(115deg, rgba(217,188,122,.24), rgba(64,44,18,.78));
    color: var(--gold-bright);
    box-shadow: inset 0 -3px 0 var(--gold);
  }

  .resource-tab:focus-visible {
    position: relative;
    z-index: 1;
    outline: 2px solid var(--gold-bright);
    outline-offset: -4px;
  }

  .resource-tab-panel[hidden] { display: none; }

  .resource-tab-panel:focus { outline: none; }

  .resource-tab-panel:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }

  .empty-tab-message {
    margin: 0;
    padding: 32px 24px;
    border: 1px solid rgba(217,188,122,.2);
    background: rgba(9,7,5,.62);
    color: var(--muted);
    font-size: 18px;
    font-style: italic;
    text-align: center;
  }

  .resources-table-wrap {
    overflow-x: auto;
    border: 1px solid rgba(217,188,122,.2);
    background: rgba(9,7,5,.62);
  }

  .waffle {
    width: 100%;
    min-width: 720px;
    table-layout: fixed;
    border-collapse: collapse;
  }

  .waffle thead,
  .waffle th.row-headers-background {
    display: none;
  }

  .waffle td {
    padding: 13px 16px;
    border-bottom: 1px solid rgba(217,188,122,.13);
    background: rgba(255,255,255,.012);
    color: #c9c0aa;
    font-size: 17px;
    line-height: 1.3;
    text-align: left;
    vertical-align: top;
    white-space: normal;
  }

  .waffle td:nth-of-type(1) { width: 34%; }
  .waffle td:nth-of-type(2) { width: 66%; color: #b8ad91; }
  .waffle .softmerge-inner { width: auto !important; left: auto !important; }

  .waffle tr:nth-child(even) td:not(.s0) {
    background: rgba(217,188,122,.025);
  }

  .waffle td.s0 {
    padding: 15px 16px 13px;
    background: linear-gradient(110deg, rgba(217,188,122,.22), rgba(64,44,18,.72));
    border-top: 1px solid rgba(217,188,122,.5);
    border-bottom: 1px solid rgba(217,188,122,.4);
    color: var(--gold-bright);
    font-family: Cinzel, Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .055em;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .waffle td.s0 + td.s0 {
    color: #d7c8a6;
    font-size: 13px;
    letter-spacing: .16em;
    text-align: right;
  }

  .waffle td.s1,
  .waffle td.s2,
  .waffle td.s3 {
    color: #b8ad91;
  }

  .waffle td.s2 a,
  .waffle td.s1 a,
  .waffle td.s3 a {
    color: var(--gold);
    font-weight: 500;
    text-decoration-color: rgba(217,188,122,.5);
    text-underline-offset: 3px;
  }

  .waffle td.s2 a:hover,
  .waffle td.s1 a:hover,
  .waffle td.s3 a:hover {
    color: var(--gold-bright);
  }

  footer {
    margin-top: auto;
    border-top: 1px solid var(--line);
    background: var(--deep-night);
  }

  .footer-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 30px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #9b8f72;
    font-size: 16px;
    font-style: italic;
    text-align: center;
  }

  .footer-inner img {
    width: 52px;
    height: 52px;
    flex: 0 0 auto;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(217,188,122,.5), 0 4px 16px rgba(0,0,0,.6);
  }

  @media (max-width: 760px) {
    main { padding: 32px 14px 52px; }
    .resource-tabs {
      display: flex;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: rgba(217,188,122,.55) rgba(9,7,5,.92);
    }
    .resource-tab {
      flex: 0 0 158px;
      font-size: 12px;
    }
    .resources-panel { padding: 6px; }
    .resources-table-wrap { overflow-x: visible; }
    .waffle { min-width: 0; }
    .waffle tr,
    .waffle td { display: block; width: 100% !important; }
    .waffle td { padding: 10px 12px; border-bottom: 0; }
    .waffle td:nth-of-type(2) {
      padding-top: 0;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(217,188,122,.13);
    }
    .waffle td.s0 { padding: 13px 12px; }
    .waffle td.s0 + td.s0 { display: none; }
    .footer-inner { flex-direction: column; padding: 26px 20px; }
  }
</style>
</head>
<body>
<div class="site-shell">
  <header class="hero">
    <img class="hero-art" src="../assets/images/mms.webp" alt="">
    <div class="hero-wash"></div>
    <mms-site-switcher current="resources" placement="overlay"></mms-site-switcher>
    <div class="hero-content">
      <img class="hero-logo" src="../assets/images/logo.webp" alt="Dark Elf Modding logo">
      <h1>Resources</h1>
      <p class="hero-subtitle">Tools, tutorials, and community knowledge for Morrowind modders</p>
    </div>
  </header>

  <main>
    <section aria-labelledby="resources-table-title">
      <h2 id="resources-table-title" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Morrowind modding resources directory</h2>
<!-- RESOURCES_DIRECTORY -->
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <img src="../assets/images/deg.webp" alt="darkelfguy portrait">
      <span>darkelfmodding.com &mdash; Morrowind modding, showcased since 2014</span>
    </div>
  </footer>
</div>
</body>
