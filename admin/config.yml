  - name: modathon_achievements
    label: Modathon Achievements
    label_singular: Modathon Achievement Year
    description: Achievement definitions and unlockers are stored in one file per year.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: "2015 achievements"
        name: achievements_2015
        file: modathon/assets/data/2015-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2015
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2015 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields: &achievement_fields
              - label: Internal achievement ID
                name: id
                widget: string
                hint: Stable lowercase ID used by image filenames and historical data. Do not change it casually.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - label: Public achievement name
                name: name
                widget: string
              - label: Requirement
                name: requirement
                widget: text
              - label: Mastery name
                name: masteryName
                widget: string
                required: false
                hint: Optional historical mastery label.
              - label: Public rarity label
                name: rarity
                widget: select
                required: false
                hint: Some historical achievements intentionally have no rarity label.
                options:
                  - Bronze
                  - Challenge
                  - Challenge/Super
                  - Category
                  - Copper
                  - Gold
                  - Hidden
                  - Hidden / Gold
                  - Hidden / Silver
                  - Hidden/Copper
                  - Hidden/Silver
                  - Hidden/Super
                  - Metrics
                  - Ruby
                  - Silver
                  - Updated Mod Badge
              - label: Rarity key
                name: rarityKey
                widget: select
                hint: Internal styling key. Keep it consistent with the public rarity label.
                options:
                  - bronze
                  - challenge
                  - challenge-super
                  - category
                  - copper
                  - gold
                  - hidden
                  - hidden-copper
                  - hidden-gold
                  - hidden-silver
                  - hidden-super
                  - metrics
                  - ruby
                  - silver
                  - unspecified
                  - updated-mod-badge
              - label: Display group
                name: group
                widget: select
                hint: Internal grouping used by achievement filters and styling.
                options:
                  - badge
                  - category
                  - challenge
                  - challenge-super
                  - hidden
                  - hidden-metal
                  - hidden-super
                  - metal
                  - metric
                  - standard
              - label: Badge image
                name: imageUrl
                widget: image_path
                required: false
                hint: Enter a complete URL or a site-relative path. The current value and image preview are both shown.
              - label: Unlocked by
                name: unlockedBy
                widget: list
                label_singular: Modder
                allow_reorder: false
                hint: Choose a central Modders record to avoid spelling and capitalization mismatches.
                field:
                  label: Modder name
                  name: modder
                  widget: relation
                  collection: modders
                  file: registry
                  search_fields: ['modders.*.name', 'modders.*.aliases']
                  display_fields: ['modders.*.name']
                  value_field: 'modders.*.name'
                  options_length: 100
              - label: Unlock count
                name: unlockedCount
                widget: hidden
                hint: Calculated automatically from the number of names in Unlocked by.
      - label: "2016 achievements"
        name: achievements_2016
        file: modathon/assets/data/2016-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2016
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2016 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
