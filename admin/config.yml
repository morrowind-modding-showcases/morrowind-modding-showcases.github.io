  - name: modders
    label: Modders
    label_singular: Central Modder Registry
    description: Site-wide base profiles. Event-specific registries reference these stable IDs.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Central modder registry
        name: registry
        file: assets/data/modders.json
        fields:
          - label: Modders
            name: modders
            widget: list
            label_singular: Modder
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Stable modder ID
                name: id
                widget: string
                hint: Used by every event site. Do not change an existing ID without updating every reference.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - label: Public display name
                name: name
                widget: string
                hint: Preserve an old display name as an alias when correcting it.
              - label: Nexus profile URL
                name: nexusProfileUrl
                widget: string
                required: false
                hint: Historical records may intentionally be blank.
                pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
              - label: Avatar URL or path
                name: avatarUrl
                widget: image_path
                required: false
                hint: Enter a complete public URL or a site-relative image path. The current value is always visible.
              - label: Previous names and aliases
                name: aliases
                widget: list
                label_singular: Alias
                required: false
                allow_reorder: false
                hint: Aliases keep older submission and achievement credits linked after a display-name correction.
                field:
                  label: Alias
                  name: alias
                  widget: string

  - name: modathon_modders
    label: Modathon Modders
    label_singular: Modathon Modder Registry
    description: Choose which central modder profiles appear on the Modathon site.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Modathon modder references
        name: registry
        file: modathon/assets/data/modders.json
        fields:
          - label: Modders
            name: modders
            widget: list
            label_singular: Modder
            allow_reorder: false
            field: &modder_id_relation
              label: Modder
              name: modder
              widget: relation
              collection: modders
              file: registry
              search_fields: ['modders.*.name', 'modders.*.aliases', 'modders.*.id']
              display_fields: ['modders.*.name']
              value_field: 'modders.*.id'
              options_length: 100

  - name: modjam_modders
    label: Modjam Modders
    label_singular: Modjam Modder Registry
    description: Choose which central modder profiles receive Modjam profiles.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Modjam modder references
        name: registry
        file: modjam/data/modders.json
        fields:
          - { label: Generated timestamp, name: generatedAt, widget: hidden, required: false }
          - label: Modders
            name: modders
            widget: list
            label_singular: Modder
            allow_reorder: false
            field: *modder_id_relation

