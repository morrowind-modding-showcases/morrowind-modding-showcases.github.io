  - name: modathon_modders
    label: Modathon Modders
    label_singular: Modder Registry
    description: Add profiles and correct public names, links, avatars, or aliases.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Modder registry
        name: registry
        file: modathon/assets/data/modders.json
        fields:
          - label: Modders
            name: modders
            widget: list
            label_singular: Modder
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Public display name
                name: name
                widget: string
                hint: Submissions refer to modders by this name or an alias. Preserve the old name as an alias when correcting a display name.
              - label: Profile URL
                name: url
                widget: string
                required: false
                hint: Nexus profile or another public profile URL. Historical records may intentionally be blank.
                pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
              - label: Avatar
                name: avatar
                widget: image
                required: false
                choose_url: true
                hint: Use an existing public avatar URL or upload an image. Run the avatar cache script later if a same-origin cached copy is desired.
                media_library:
                  config:
                    max_file_size: 5242880
              - label: Previous names and aliases
                name: aliases
                widget: list
                label_singular: Alias
                required: false
                allow_reorder: false
                hint: Aliases keep older submission and achievement credits linked after a display-name correction.
                field:
                  label: Alias
                  name: alias
                  widget: string

  - name: modathon_winners
    label: Modathon Winner History
    label_singular: Winner History
    description: Safe site-level content for the winner archive. Year and award order are preserved.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Winner history
        name: history
        file: modathon/assets/data/winners.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Winner year
            collapsed: true
            minimize_collapsed: true
            summary: 'Modathon {{fields.year}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 2015
                max: 2100
              - label: Historical note
                name: note
                widget: text
                required: false
              - label: Legacy individual-card layout
                name: individualModCards
                widget: hidden
                required: false
              - label: Awards
                name: awards
                widget: list
                label_singular: Award
                collapsed: true
                summary: '{{fields.award}}'
                allow_remove: false
                allow_reorder: false
                fields:
                  - label: Award name
                    name: award
                    widget: string
                  - label: Winning mods
                    name: mods
                    widget: list
                    label_singular: Winning mod
                    collapsed: true
                    summary: '{{fields.name}} — {{fields.attribution}}'
                    allow_remove: false
                    allow_reorder: false
                    fields:
                      - label: Public mod name
                        name: name
                        widget: string
                      - label: Public attribution
                        name: attribution
                        widget: string
                      - label: Archive lookup name
                        name: archiveName
                        widget: string
                        required: false
                        hint: Optional alternate name used to match the submission archive.
