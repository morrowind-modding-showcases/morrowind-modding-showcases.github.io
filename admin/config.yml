  - name: modathon_mods
    label: Modathon Mods
    label_singular: Modathon Mod
    description: Add or correct Modathon mods. Nexus statistics are preserved but hidden because the daily updater owns them.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Modathon mods
        name: mods
        file: modathon/assets/data/modathon-mods.json
        fields:
          - label: Snapshot timestamp
            name: generated
            widget: hidden
          - label: Game
            name: game
            widget: hidden
          - label: Mods
            name: mods
            widget: list
            label_singular: Mod
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.year}})'
            allow_reorder: false
            fields:
              - label: Year
                name: year
                widget: select
                options: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
              - label: Public mod name
                name: name
                widget: string
                hint: The title shown on the website.
              - label: Authors
                name: authors
                widget: list
                label_singular: Author
                allow_reorder: false
                hint: Names come from the central Modders registry. Multiple authors are supported.
                field:
                  label: Author
                  name: author
                  widget: registry_modder
                  registry_value: name
              - label: Website category
                name: category
                widget: select
                hint: Choose the broad category used by the Modathon website.
                options:
                  - Character Customization
                  - Dungeon
                  - Gameplay, Patch, or UI
                  - Graphics, Animations, or Audio
                  - Immersion
                  - Items
                  - Landscape or Landmass
                  - NPCs and Creatures
                  - Player Home
                  - Quests
                  - Resource or Utility
                  - Towns and Cities
                  - Unknown
              - label: Mod page URL
                name: url
                widget: string
                hint: This URL is the practical stable identifier for a mod. Change it only to correct the destination.
                pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
              - label: Showcase URL
                name: showcaseUrl
                widget: string
                required: false
                hint: Optional YouTube showcase for this mod.
                pattern: ['^https://www\.youtube\.com/watch\?v=[\w-]{11}(?:&.*)?$', 'Enter a complete YouTube watch URL.']
              - { label: Downloads, name: downloads, widget: hidden, required: false }
              - { label: Unique downloads, name: uniqueDownloads, widget: hidden, required: false }
              - { label: Endorsements, name: endorsements, widget: hidden, required: false }
              - { label: Available on Nexus, name: available, widget: hidden, required: false }
              - { label: Nexus category, name: nexusCategory, widget: hidden, required: false }
              - label: Nexus image
                name: pictureUrl
                widget: image_path
                required: false
                hint: The current image URL or site path is shown once with its preview. The daily Nexus updater may replace it.
              - { label: Nexus response status, name: status, widget: hidden, required: false }

  - name: modathon_winners
    label: Modathon Winner History
    label_singular: Winner History
    description: Safe site-level content for the winner archive. Year and award order are preserved.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Winner history
        name: history
        file: modathon/assets/data/winners.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Winner year
            collapsed: true
            minimize_collapsed: true
            summary: 'Modathon {{fields.year}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 2015
                max: 2100
              - label: Historical note
                name: note
                widget: text
                required: false
              - label: Legacy individual-card layout
                name: individualModCards
                widget: hidden
                required: false
              - label: Awards
                name: awards
                widget: list
                label_singular: Award
                collapsed: true
                summary: '{{fields.award}}'
                allow_remove: false
                allow_reorder: false
                fields:
                  - label: Award name
                    name: award
                    widget: string
                  - label: Winning mods
                    name: mods
                    widget: list
                    label_singular: Winning mod
                    collapsed: true
                    summary: '{{fields.name}} — {{fields.attribution}}'
                    allow_remove: false
                    allow_reorder: false
                    fields:
                      - label: Public mod name
                        name: name
                        widget: archive_mod
                        archive_source: modathon
                        year_document: winners
                      - label: Public attribution
                        name: attribution
                        widget: list
                        label_singular: Modder
                        allow_reorder: false
                        field:
                          label: Modder
                          name: modder
                          widget: registry_modder
                          registry_value: name
                      - label: Archive lookup name
                        name: archiveName
                        widget: string
                        required: false
                        hint: Optional alternate name used to match the submission archive.

  - name: modders
    label: Modders
    label_singular: Central Modder Registry
    description: Site-wide base profiles. Event-specific registries reference these stable IDs.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Central modder registry
        name: registry
        file: assets/data/modders.json
        fields:
          - label: Modders
            name: modders
            widget: list
            label_singular: Modder
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Stable modder ID
                name: id
                widget: string
                hint: Used by every event site. Do not change an existing ID without updating every reference.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - label: Public display name
                name: name
                widget: string
                hint: Preserve an old display name as an alias when correcting it.
              - label: Nexus profile URL
                name: nexusProfileUrl
                widget: string
                required: false
                hint: Historical records may intentionally be blank.
                pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
              - label: Avatar URL or path
                name: avatarUrl
                widget: string
                required: false
                hint: Enter or edit a complete public URL or a site-relative image path.
                pattern: ['^(?:https?://\S+|/\S+)$', 'Enter a complete http:// or https:// URL, or a site-relative path beginning with /.']
              - label: Previous names and aliases
                name: aliases
                widget: list
                label_singular: Alias
                required: false
                allow_reorder: false
                hint: Aliases keep older submission and achievement credits linked after a display-name correction.
                field:
                  label: Alias
                  name: alias
                  widget: string

  - name: modjam_judges
    label: Modjam Judges
    label_singular: Judge Registry
    description: Edit the judge roster using central modder IDs.
    format: json
