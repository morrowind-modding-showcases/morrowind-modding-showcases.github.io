backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Update {{collection}}: {{slug}}'
    uploadMedia: 'Upload media: {{path}}'
    deleteMedia: 'Delete media: {{path}}'

publish_mode: simple
local_backend: true

site_url: https://darkelfmodding.com
display_url: https://darkelfmodding.com
show_preview_links: false

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: modathon_submissions
    label: Modathon Submissions
    label_singular: Modathon Submission Archive
    description: Add or correct Modathon submissions by year. Nexus statistics are preserved but hidden because the daily updater owns them.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: All years (2015–2026)
        name: all_years
        file: modathon/assets/data/nexus-stats.json
        fields:
          - label: Snapshot timestamp
            name: generated
            widget: hidden
          - label: Game
            name: game
            widget: hidden
          - label: Submissions by year
            name: mods
            widget: object
            collapsed: false
            fields:
              - label: "2015 submissions"
                name: "2015"
                widget: list
                label_singular: Submission
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.name}} — {{fields.authors}}'
                allow_remove: false
                allow_reorder: false
                fields: &submission_fields
                  - label: Public mod name
                    name: name
                    widget: string
                    hint: The title shown on the website.
                  - label: Authors
                    name: authors
                    widget: list
                    label_singular: Author
                    allow_reorder: false
                    hint: Use the exact public name stored in the Modders collection. Multiple authors are supported. Submissions store names, not internal IDs.
                    field:
                      label: Author name
                      name: author
                      widget: string
                  - label: Website category
                    name: category
                    widget: select
                    hint: Choose the broad category used by the Modathon website.
                    options:
                      - Character Customization
                      - Dungeon
                      - Gameplay, Patch, or UI
                      - Graphics, Animations, or Audio
                      - Immersion
                      - Items
                      - Landscape or Landmass
                      - NPCs and Creatures
                      - Player Home
                      - Quests
                      - Resource or Utility
                      - Towns and Cities
                      - Unknown
                  - label: Mod page URL
                    name: url
                    widget: string
                    hint: This URL is the practical stable identifier for a submission. Change it only to correct the destination.
                    pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
                  - label: Downloads
                    name: downloads
                    widget: hidden
                    required: false
                  - label: Unique downloads
                    name: uniqueDownloads
                    widget: hidden
                    required: false
                  - label: Endorsements
                    name: endorsements
                    widget: hidden
                    required: false
                  - label: Available on Nexus
                    name: available
                    widget: hidden
                    required: false
                  - label: Nexus category
                    name: nexusCategory
                    widget: hidden
                    required: false
                  - label: Nexus image
                    name: pictureUrl
                    widget: hidden
                    required: false
                  - label: Nexus response status
                    name: status
                    widget: hidden
                    required: false
              - label: "2016 submissions"
                name: "2016"
                widget: list
                label_singular: Submission
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.name}} — {{fields.authors}}'
                allow_remove: false
                allow_reorder: false
                fields: *submission_fields
              - label: "2017 submissions"
                name: "2017"
                widget: list
                label_singular: Submission
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.name}} — {{fields.authors}}'
                allow_remove: false
                allow_reorder: false
                fields: *submission_fields
              - label: "2018 submissions"
                name: "2018"
                widget: list
                label_singular: Submission
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.name}} — {{fields.authors}}'
                allow_remove: false
                allow_reorder: false
                fields: *submission_fields
              - label: "2019 submissions"
                name: "2019"
                widget: list
                label_singular: Submission
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.name}} — {{fields.authors}}'
                allow_remove: false
                allow_reorder: false
                fields: *submission_fields
              - label: "2020 submissions"
                name: "2020"
                widget: list
