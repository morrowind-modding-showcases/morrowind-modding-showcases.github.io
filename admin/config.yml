backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Update {{collection}}: {{slug}}'
    uploadMedia: 'Upload media: {{path}}'
    deleteMedia: 'Delete media: {{path}}'

publish_mode: simple
local_backend: true

site_url: https://darkelfmodding.com
display_url: https://darkelfmodding.com
show_preview_links: false

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: madness_mods
    label: Madness Mods
    label_singular: Madness Mod Archive
    description: Edit the detailed Madness submission archive by year.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Madness mods
        name: mods
        file: madness/data/madness-mods.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Year
            collapsed: true
            summary: 'Madness {{fields.year}}'
            allow_reorder: false
            fields:
              - { label: Year, name: year, widget: number, value_type: int, min: 2016, max: 2100 }
              - label: Mods
                name: mods
                widget: list
                label_singular: Mod
                collapsed: true
                summary: '{{fields.name}}'
                allow_reorder: false
                fields:
                  - { label: Mod name, name: name, widget: string }
                  - { label: Mod URL, name: url, widget: string, required: false }
                  - { label: Team, name: team, widget: string, required: false }
                  - { label: Category, name: category, widget: string, required: false }
                  - { label: Place, name: place, widget: string, required: false }
                  - { label: Notes, name: notes, widget: text, required: false }
                  - label: Picture URL or path
                    name: pictureUrl
                    widget: image_path
                    required: false

  - name: madness_teams
    label: Madness Teams
    label_singular: Madness Team Archive
    description: Edit team rosters and select team mods from the detailed Madness archive.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Madness teams
        name: teams
        file: madness/data/madness-teams.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Year
            collapsed: true
            summary: 'Madness {{fields.year}}'
            allow_reorder: false
            fields:
              - { label: Year, name: year, widget: number, value_type: int, min: 2016, max: 2100 }
              - label: Teams
                name: teams
                widget: list
                label_singular: Team
                collapsed: true
                summary: '{{fields.name}}'
                allow_reorder: false
                fields:
                  - { label: Team name, name: name, widget: string }
                  - { label: Team place, name: place, widget: string, required: false }
                  - label: Mods
                    name: mods
                    widget: list
                    label_singular: Team mod
                    collapsed: true
                    summary: '{{fields.name}}'
                    allow_reorder: false
                    fields:
                      - label: Mod name
                        name: name
                        widget: archive_mod
                        archive_source: madness
                        year_document: madness-teams
                  - label: Members
                    name: members
                    widget: list
                    label_singular: Team member
                    allow_reorder: false
                    fields:
                      - label: Modder
                        name: id
                        widget: registry_modder
                        registry_value: id

  - name: modathon_achievements
    label: Modathon Achievements
    label_singular: Modathon Achievement Year
    description: Achievement definitions and unlockers are stored in one file per year.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: "2015 achievements"
        name: achievements_2015
        file: modathon/assets/data/2015-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2015
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2015 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields: &achievement_fields
              - label: Internal achievement ID
                name: id
                widget: string
                hint: Stable lowercase ID used by image filenames and historical data. Do not change it casually.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - label: Public achievement name
                name: name
                widget: string
              - label: Requirement
                name: requirement
                widget: text
              - label: Mastery name
                name: masteryName
                widget: string
                required: false
                hint: Optional historical mastery label.
              - label: Public rarity label
                name: rarity
                widget: select
                required: false
                hint: Some historical achievements intentionally have no rarity label.
                options:
                  - Bronze
                  - Challenge
                  - Challenge/Super
                  - Category
                  - Copper
                  - Gold
                  - Hidden
                  - Hidden / Gold
                  - Hidden / Silver
                  - Hidden/Copper
                  - Hidden/Silver
                  - Hidden/Super
                  - Metrics
                  - Ruby
                  - Silver
                  - Updated Mod Badge
              - label: Rarity key
                name: rarityKey
                widget: select
                hint: Internal styling key. Keep it consistent with the public rarity label.
                options:
                  - bronze
                  - challenge
                  - challenge-super
                  - category
                  - copper
                  - gold
                  - hidden
                  - hidden-copper
                  - hidden-gold
                  - hidden-silver
                  - hidden-super
                  - metrics
                  - ruby
                  - silver
                  - unspecified
                  - updated-mod-badge
              - label: Display group
                name: group
                widget: select
                hint: Internal grouping used by achievement filters and styling.
                options:
                  - badge
                  - category
                  - challenge
                  - challenge-super
                  - hidden
                  - hidden-metal
                  - hidden-super
                  - metal
                  - metric
                  - standard
              - label: Badge image
                name: imageUrl
                widget: image_path
                required: false
                hint: Enter a complete URL or a site-relative path. The current value is shown once with its preview.
              - label: Unlocked by
                name: unlockedBy
                widget: list
                label_singular: Modder
                allow_reorder: false
                hint: Choose a central Modders record to avoid spelling and capitalization mismatches.
                field:
                  label: Modder
                  name: modder
                  widget: registry_modder
                  registry_value: name
              - label: Unlock count
                name: unlockedCount
                widget: hidden
                hint: Calculated automatically from the number of names in Unlocked by.
      - label: "2016 achievements"
        name: achievements_2016
        file: modathon/assets/data/2016-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2016
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2016 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
