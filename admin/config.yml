  - name: modjam_archive
    label: Modjams
    label_singular: Modjam Archive
    description: Edit Modjam events, entries, results, artwork, and author references.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Modjam archive
        name: archive
        file: modjam/data/modjams.json
        fields:
          - { label: Generated timestamp, name: generatedAt, widget: hidden, required: false }
          - label: Derived summary
            name: summary
            widget: object
            collapsed: true
            fields:
              - { label: Event count, name: eventCount, widget: hidden }
              - { label: Entry count, name: entryCount, widget: hidden }
              - { label: Modder count, name: modderCount, widget: hidden }
              - { label: Listed modder count, name: listedModderCount, widget: hidden }
              - { label: Placement count, name: placementCount, widget: hidden }
              - { label: Judge award count, name: judgeAwardCount, widget: hidden }
              - { label: Placard count, name: placardCount, widget: hidden }
              - { label: Categories, name: categories, widget: hidden }
          - label: Events
            name: events
            widget: list
            label_singular: Modjam
            collapsed: true
            summary: '{{fields.label}}'
            allow_reorder: false
            fields:
              - label: Stable event ID
                name: id
                widget: string
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - { label: Public event label, name: label, widget: string }
              - label: Season
                name: season
                widget: select
                options: [Winter, Spring, Summer, Autumn]
              - { label: Year, name: year, widget: number, value_type: int, min: 2020, max: 2100 }
              - { label: Banner URL or path, name: banner, widget: image_path, required: false }
              - label: Header images
                name: headers
                widget: list
                label_singular: Header image
                allow_reorder: false
                required: false
                field:
                  label: Header URL or path
                  name: header
                  widget: image_path
              - { label: Results stream URL, name: resultsStreamUrl, widget: string, required: false }
              - label: Competition type
                name: competitionType
                widget: select
                options:
                  - { label: Just for fun, value: just-for-fun }
                  - { label: Popular choice, value: popular-choice }
                  - { label: Judged, value: judged }
              - { label: Competition label, name: competitionLabel, widget: string }
              - { label: Competition note, name: competitionNote, widget: text }
              - { label: Has judge awards, name: hasJudgeAwards, widget: boolean }
              - label: Entries
                name: entries
                widget: list
                label_singular: Entry
                collapsed: true
                summary: '{{fields.title}}'
                allow_reorder: false
                fields:
                  - label: Stable entry ID
                    name: id
                    widget: string
                    pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
                  - { label: Mod title, name: title, widget: string }
                  - { label: Mod URL, name: url, widget: string, required: false }
                  - label: Authors
                    name: authors
                    widget: list
                    label_singular: Author
                    allow_reorder: false
                    field: *modder_id_relation
                  - label: Themes
                    name: themes
                    widget: list
                    label_singular: Theme
                    allow_reorder: false
                    field: { label: Theme, name: theme, widget: string }
                  - { label: Category, name: category, widget: string }
                  - label: Placement key
                    name: placement
                    widget: select
                    required: false
                    options:
                      - { label: First, value: first }
                      - { label: Runner-up, value: runner-up }
                      - { label: Third, value: third }
                      - { label: Popular choice, value: popular-choice }
                  - { label: Placement label, name: placementLabel, widget: string, required: false }
                  - label: Judge awards
                    name: awards
                    widget: list
                    label_singular: Award
                    allow_reorder: false
                    required: false
                    field: { label: Award, name: award, widget: string }
                  - { label: Award placard URL or path, name: awardPlacardUrl, widget: image_path, required: false }
                  - { label: Picture URL or path, name: pictureUrl, widget: image_path, required: false }

  - name: modjam_postcards
    label: Modjam Postcards
    label_singular: Postcard Manifest
    description: Edit postcard-to-entry links and optional captions.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Postcards
        name: postcards
        file: modjam/data/postcards.json
        fields:
          - label: Postcards
            name: postcards
            widget: list
            label_singular: Postcard
            collapsed: true
            summary: '{{fields.file}}'
            allow_reorder: false
            fields:
              - label: Image filename
                name: file
                widget: string
                hint: Relative to modjam/assets/postcards/full and thumbnail. The stored path is shown directly.
              - label: Modjam entry
                name: entryId
                widget: relation
                collection: modjam_archive
                file: archive
                search_fields: ['events.*.entries.*.title', 'events.*.entries.*.id']
                display_fields: ['events.*.entries.*.title']
                value_field: 'events.*.entries.*.id'
                options_length: 100
              - { label: Caption, name: caption, widget: string, required: false }
              - label: Caption position
                name: captionPosition
                widget: select
                required: false
                options:
                  - { label: Upper left, value: upper-left }
                  - { label: Lower right, value: lower-right }
