  - name: modathon_winners
    label: Modathon Winner History
    label_singular: Winner History
    description: Safe site-level content for the winner archive. Year and award order are preserved.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Winner history
        name: history
        file: modathon/assets/data/winners.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Winner year
            collapsed: true
            minimize_collapsed: true
            summary: 'Modathon {{fields.year}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - label: Year
                name: year
                widget: number
                value_type: int
                min: 2015
                max: 2100
              - label: Historical note
                name: note
                widget: text
                required: false
              - label: Legacy individual-card layout
                name: individualModCards
                widget: hidden
                required: false
              - label: Awards
                name: awards
                widget: list
                label_singular: Award
                collapsed: true
                summary: '{{fields.award}}'
                allow_remove: false
                allow_reorder: false
                fields:
                  - label: Award name
                    name: award
                    widget: string
                  - label: Winning mods
                    name: mods
                    widget: list
                    label_singular: Winning mod
                    collapsed: true
                    summary: '{{fields.name}} — {{fields.attribution}}'
                    allow_remove: false
                    allow_reorder: false
                    fields:
                      - label: Public mod name
                        name: name
                        widget: string
                      - label: Public attribution
                        name: attribution
                        widget: string
                      - label: Archive lookup name
                        name: archiveName
                        widget: string
                        required: false
                        hint: Optional alternate name used to match the submission archive.

  - name: modathon_showcases
    label: Modathon Showcases
    label_singular: Showcase Registry
    description: Add or edit YouTube showcase links using the exact public mod name.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Showcase links
        name: showcases
        file: modathon/assets/data/showcases.json
        fields:
          - label: Showcases
            name: showcases
            widget: list
            label_singular: Showcase
            collapsed: true
            summary: '{{fields.name}}'
            allow_reorder: false
            fields:
              - { label: Exact mod name, name: name, widget: string }
              - label: YouTube URL
                name: url
                widget: string
                pattern: ['^https://www\.youtube\.com/watch\?v=[\w-]{11}(?:&.*)?$', 'Enter a complete YouTube watch URL.']

  - name: madness_teams
    label: Madness Teams
    label_singular: Madness Team Archive
    description: Edit team rosters and team submission links by year.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Madness teams
        name: teams
        file: madness/data/madness-teams.json
        fields:
          - label: Years
            name: years
            widget: list
            label_singular: Year
            collapsed: true
            summary: 'Madness {{fields.year}}'
            allow_reorder: false
            fields:
              - { label: Year, name: year, widget: number, value_type: int, min: 2016, max: 2100 }
              - label: Teams
                name: teams
                widget: list
                label_singular: Team
                collapsed: true
                summary: '{{fields.name}}'
                allow_reorder: false
                fields:
                  - { label: Team name, name: name, widget: string }
                  - { label: Team place, name: place, widget: string, required: false }
                  - label: Mods
                    name: mods
                    widget: list
                    label_singular: Team mod
                    collapsed: true
                    summary: '{{fields.name}}'
                    allow_reorder: false
                    fields:
                      - { label: Mod name, name: name, widget: string }
                      - { label: Mod URL, name: url, widget: string, required: false }
                  - label: Members
                    name: members
                    widget: list
                    label_singular: Team member
                    allow_reorder: false
                    field: *modder_id_relation

