backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Update {{collection}}: {{slug}}'
    uploadMedia: 'Upload media: {{path}}'
    deleteMedia: 'Delete media: {{path}}'

publish_mode: simple
local_backend: true

site_url: https://darkelfmodding.com
display_url: https://darkelfmodding.com
show_preview_links: false

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: madness
    label: Madness
    label_singular: Madness content
    description: Add Madness seasons and edit their schedules.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Events
        name: events
        file: madness/data/madness-event.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - { label: Event type, name: eventType, widget: hidden, default: madness }
          - label: Events
            name: events
            widget: list
            label_singular: Madness
            collapsed: true
            minimize_collapsed: true
            summary: 'Madness {{fields.year}} · Season {{fields.season}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - { label: Event name, name: name, widget: hidden, required: false }
              - { label: Year, name: year, widget: event_year, value_type: int, min: 2016, max: 2100 }
              - { label: Season, name: season, widget: number, value_type: int, min: 1, max: 100 }
              - { label: Timezone label, name: timezoneLabel, widget: hidden, default: UTC, required: false }
              - label: Countdown
                name: countdown
                widget: object
                collapsed: true
                required: false
                hint: The newest event must have all four UTC milestones.
                fields:
                  - { label: Team registration opens, name: registrationOpen, widget: event_datetime, event_type: madness, event_default: '2026-09-01T00:00:00.000Z' }
                  - { label: Competition begins, name: competitionStart, widget: event_datetime, event_type: madness, event_default: '2026-10-01T00:00:00.000Z' }
                  - { label: Submissions close, name: submissionsClose, widget: event_datetime, event_type: madness, event_default: '2026-11-07T00:00:00.000Z' }
                  - { label: Bug-fixing ends, name: bugFixEnd, widget: event_datetime, event_type: madness, event_default: '2026-11-15T00:00:00.000Z' }
              - label: Formspree form ID
                name: registrationFormId
                widget: hidden
                required: false

  - name: madness_mods
    label: Madness Mods
    label_singular: Madness Mod
    description: One source file per Madness submission. Public year-grouped data is generated during deployment.
    folder: content/madness/mods
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{year}} · {{name}}"
    editor: { preview: false }
    fields:
      - { label: Year, name: year, widget: number, value_type: int, min: 2016, max: 2100 }
      - { label: Mod name, name: name, widget: string }
      - { label: Mod URL, name: url, widget: string, required: false }
      - { label: Team, name: team, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Place, name: place, widget: string, required: false }
      - { label: Notes, name: notes, widget: text, required: false }
      - { label: Nexus image, name: pictureUrl, widget: hidden, required: false }

  - name: madness_teams
    label: Madness Teams
    label_singular: Madness Team
    description: One source file per Madness team. The year is stored in and edited on each team record.
    folder: content/madness/teams
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{year}} · {{name}}"
    editor: { preview: false }
    fields:
      - { label: Year, name: year, widget: number, value_type: int, min: 2016, max: 2100 }
      - { label: Team name, name: name, widget: string }
      - { label: Team place, name: place, widget: string, required: false }
      - label: Mods
        name: mods
        widget: list
        label_singular: Team mod
        collapsed: true
        summary: '{{fields.name}}'
        allow_reorder: false
        fields:
          - label: Mod name
            name: name
            widget: archive_mod
            archive_source: madness
      - label: Members
        name: members
        widget: list
        label_singular: Team member
        allow_reorder: false
        fields:
          - label: Modder
            name: id
            widget: registry_modder
            registry_value: id

  - name: modathon
    label: Modathon
    label_singular: Modathon content
    description: Add annual Modathons and maintain schedules, awards, and achievements.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Events
        name: events
        file: modathon/assets/data/modathon-event.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - { label: Event type, name: eventType, widget: hidden, default: modathon }
          - label: Events
            name: events
            widget: list
            label_singular: Modathon
            collapsed: true
            minimize_collapsed: true
            summary: 'Modathon {{fields.year}}'
            allow_remove: false
            allow_reorder: false
            fields:
              - { label: Event name, name: name, widget: hidden, required: false }
              - { label: Year, name: year, widget: event_year, value_type: int, min: 2015, max: 2100 }
              - { label: Timezone label, name: timezoneLabel, widget: hidden, default: UTC }
              - label: Countdown
                name: countdown
                widget: object
                collapsed: true
                hint: All countdown times are UTC. The newest event must have all four values.
                fields:
                  - { label: Modathon begins, name: start, widget: event_datetime, event_type: modathon, event_default: '2026-05-01T00:00:00.000Z' }
                  - { label: Main deadline, name: end, widget: event_datetime, event_type: modathon, event_default: '2026-06-02T00:00:00.000Z' }
                  - { label: Grace period ends, name: graceEnd, widget: event_datetime, event_type: modathon, event_default: '2026-06-02T12:00:00.000Z' }
                  - { label: Countdown resets for next year, name: reset, widget: event_datetime, event_type: modathon, event_default: '2026-07-01T00:00:00.000Z' }
              - label: Historical note
                name: note
                widget: text
                required: false
              - label: Legacy individual-card layout
                name: individualModCards
                widget: hidden
                required: false
              - label: Awards
                name: awards
                widget: list
                label_singular: Award
                collapsed: true
                summary: '{{fields.award}}'
                allow_remove: false
                allow_reorder: false
                required: false
                default:
                  - { award: Champion of Style, mods: [] }
                  - { award: Champion of Legends, mods: [] }
                  - { award: Champion of the World, mods: [] }
                  - { award: Champion of Life, mods: [] }
                  - { award: Champion of Artistry, mods: [] }
                  - { award: Champion of Comfort, mods: [] }
                  - { award: Champion of Clutter, mods: [] }
                  - { award: Champion of Enhancement, mods: [] }
                  - { award: Champion of Culture, mods: [] }
                  - { award: Champion of Dungeoneering, mods: [] }
                  - { award: Champion of Immersion, mods: [] }
                  - { award: Champion of the Community, mods: [] }
                  - { award: "The People's Choice", mods: [] }
                  - { award: Numbers Matter, mods: [] }
                fields:
                  - label: Award name
                    name: award
                    widget: string
                  - label: Winning mods
                    name: mods
                    widget: list
                    label_singular: Winning mod
                    collapsed: true
                    summary: '{{fields.name}} — {{fields.attribution}}'
                    allow_remove: false
                    allow_reorder: false
                    required: false
                    fields:
                      - label: Public mod name
                        name: name
                        widget: archive_mod
                        archive_source: modathon
                        year_document: modathon-events
                      - label: Public attribution
                        name: attribution
                        widget: list
                        label_singular: Modder
                        allow_reorder: false
                        field:
                          label: Modder
                          name: modder
                          widget: registry_modder
                          registry_value: name
                      - label: Archive lookup name
                        name: archiveName
                        widget: string
                        required: false
                        hint: Optional alternate name used to match the submission archive.
  - name: modathon_achievements
    label: Modathon Achievements
    label_singular: Achievement Year
    description: One source file per Modathon year. Create a year here, then add its achievements.
    folder: content/modathon/achievements
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: year
    slug: "{{fields.year}}-achievements"
    summary: "Modathon {{year}}"
    editor: { preview: false }
    fields:
      - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
      - label: Year
        name: year
        widget: string
        hint: Four-digit Modathon year. This also determines the source and public filenames.
        pattern: ['^(?:20(?:1[5-9]|[2-9]\d)|2100)$', 'Enter a year from 2015 through 2100.']
      - label: Achievements
        name: achievements
        widget: list
        label_singular: Achievement
        collapsed: true
        minimize_collapsed: true
        summary: '{{fields.name}} ({{fields.id}})'
        required: false
        default: []
        allow_remove: false
        allow_reorder: false
        fields:
          - label: Internal achievement ID
            name: id
            widget: string
            hint: Stable lowercase ID used by image filenames and historical data. Do not change it casually.
            pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
          - label: Public achievement name
            name: name
            widget: string
          - label: Requirement
            name: requirement
            widget: text
          - label: Mastery name
            name: masteryName
            widget: string
            required: false
            hint: Optional historical mastery label.
          - label: Public rarity label
            name: rarity
            widget: select
            required: false
            hint: Some historical achievements intentionally have no rarity label.
            options:
              - Bronze
              - Challenge
              - Challenge/Super
              - Category
              - Copper
              - Gold
              - Hidden
              - Hidden / Gold
              - Hidden / Silver
              - Hidden/Copper
              - Hidden/Silver
              - Hidden/Super
              - Metrics
              - Ruby
              - Silver
              - Updated Mod Badge
          - label: Rarity key
            name: rarityKey
            widget: select
            hint: Internal styling key. Keep it consistent with the public rarity label.
            options:
              - bronze
              - challenge
              - challenge-super
              - category
              - copper
              - gold
              - hidden
              - hidden-copper
              - hidden-gold
              - hidden-silver
              - hidden-super
              - metrics
              - ruby
              - silver
              - unspecified
              - updated-mod-badge
          - label: Display group
            name: group
            widget: select
            hint: Internal grouping used by achievement filters and styling.
            options:
              - badge
              - category
              - challenge
              - challenge-super
              - hidden
              - hidden-metal
              - hidden-super
              - metal
              - metric
              - standard
          - label: Badge image
            name: imageUrl
            widget: image_path
            required: false
            hint: Enter a complete URL or a site-relative path. The current value is shown once with its preview.
          - label: Unlocked by
            name: unlockedBy
            widget: list
            label_singular: Modder
            allow_reorder: false
            hint: Choose a central Modders record to avoid spelling and capitalization mismatches.
            field:
              label: Modder
              name: modder
              widget: registry_modder
              registry_value: name
          - label: Unlock count
            name: unlockedCount
            widget: hidden
            hint: Calculated automatically from the number of names in Unlocked by.

  - name: modathon_mods
    label: Modathon Mods
    label_singular: Modathon Mod
    description: One source file per Modathon submission. The year is stored in and edited on each record.
    folder: content/modathon/mods
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{year}} · {{name}}"
    editor: { preview: false }
    fields:
      - { label: Year, name: year, widget: number, value_type: int, min: 2015, max: 2100 }
      - label: Public mod name
        name: name
        widget: string
        hint: The title shown on the website.
      - label: Authors
        name: authors
        widget: list
        label_singular: Author
        allow_reorder: false
        hint: Enter central Modders display names or existing aliases exactly. Multiple authors are supported.
        field: { label: Author name, name: author, widget: string }
      - label: Website category
        name: category
        widget: select
        hint: Choose the broad category used by the Modathon website.
        options:
          - Character Customization
          - Dungeon
          - Gameplay, Patch, or UI
          - Graphics, Animations, or Audio
          - Immersion
          - Items
          - Landscape or Landmass
          - NPCs and Creatures
          - Player Home
          - Quests
          - Resource or Utility
          - Towns and Cities
          - Unknown
      - label: Mod page URL
        name: url
        widget: string
        hint: This URL is the practical stable identifier for a mod. Change it only to correct the destination.
        pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
      - label: Showcase URL
        name: showcaseUrl
        widget: string
        required: false
        hint: Optional YouTube showcase for this mod.
        pattern: ['^https://www\.youtube\.com/watch\?v=[\w-]{11}(?:&.*)?$', 'Enter a complete YouTube watch URL.']
      - { label: Downloads, name: downloads, widget: hidden, required: false }
      - { label: Unique downloads, name: uniqueDownloads, widget: hidden, required: false }
      - { label: Endorsements, name: endorsements, widget: hidden, required: false }
      - { label: Available on Nexus, name: available, widget: hidden, required: false }
      - { label: Nexus category, name: nexusCategory, widget: hidden, required: false }
      - { label: Nexus image, name: pictureUrl, widget: hidden, required: false }
      - { label: Nexus response status, name: status, widget: hidden, required: false }
      - { label: Nexus update error, name: error, widget: hidden, required: false }

  - name: modders
    label: Modders
    label_singular: Modder
    description: One source file per site-wide base profile. Event data references these stable IDs or registered names.
    folder: content/modders
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: name
    slug: "{{fields.id}}"
    summary: "{{name}} ({{id}})"
    editor: { preview: false }
    fields:
      - label: Stable modder ID
        name: id
        widget: string
        hint: Used across the event sites and as this file's name. Do not change an existing ID without updating every reference.
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
      - label: Public display name
        name: name
        widget: string
        hint: Preserve an old display name as an alias when correcting it.
      - label: Nexus profile URL
        name: nexusProfileUrl
        widget: string
        required: false
        hint: Historical records may intentionally be blank.
        pattern: ['^https?://\S+$', 'Enter a complete http:// or https:// URL.']
      - label: Avatar URL or path
        name: avatarUrl
        widget: string
        required: false
        hint: Enter or edit a complete public URL or a site-relative image path.
        pattern: ['^(?:https?://\S+|/\S+)$', 'Enter a complete http:// or https:// URL, or a site-relative path beginning with /.']
      - label: Previous names and aliases
        name: aliases
        widget: list
        label_singular: Alias
        required: false
        allow_reorder: false
        hint: Aliases keep older submission and achievement credits linked after a display-name correction.
        field: { label: Alias, name: alias, widget: string }

  - name: modjam
    label: ModJam
    label_singular: ModJam content
    description: Add ModJams and maintain schedules and judges.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: Judges
        name: judges
        file: modjam/data/judges.json
        fields:
          - label: Judges
            name: judges
            widget: list
            label_singular: Judge
            collapsed: true
            summary: '{{fields.modderId}}'
            allow_reorder: false
            fields:
              - label: Modder
                name: modderId
                widget: registry_modder
                registry_value: id

      - label: Events
        name: events
        file: modjam/data/modjam-event.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - { label: Event type, name: eventType, widget: hidden, default: modjam }
          - label: Events
            name: events
            widget: list
            label_singular: Modjam
            collapsed: true
            summary: '{{fields.label}}'
            allow_reorder: false
            fields:
              - { label: Stable event ID, name: id, widget: hidden, required: false }
              - { label: Public event label, name: label, widget: hidden, required: false }
              - { label: Event name, name: name, widget: hidden, required: false }
              - label: Season
                name: season
                widget: select
                options: [Winter, Spring, Summer, Autumn]
              - { label: Year, name: year, widget: event_year, value_type: int, min: 2020, max: 2100 }
              - { label: Timezone label, name: timezoneLabel, widget: hidden, default: UTC, required: false }
              - label: Countdown
                name: countdown
                widget: object
                collapsed: true
                required: false
                hint: The newest event must have all three UTC milestones.
                fields:
                  - { label: Kickoff livestream begins, name: kickoffStart, widget: event_datetime, event_type: modjam, event_default: '2026-08-21T23:00:00.000Z' }
                  - { label: Modjam begins, name: start, widget: event_datetime, event_type: modjam, event_default: '2026-08-22T00:00:00.000Z' }
                  - { label: Modjam ends, name: end, widget: event_datetime, event_type: modjam, event_default: '2026-08-24T00:00:00.000Z' }
              - { label: Participation banner URL or path, name: participationBannerUrl, widget: image_path, required: false }
              - { label: Banner URL or path, name: banner, widget: image_path, required: false }
              - label: Header images
                name: headers
                widget: list
                label_singular: Header image
                allow_reorder: false
                required: false
                field:
                  label: Header URL or path
                  name: header
                  widget: image_path
              - { label: Results stream URL, name: resultsStreamUrl, widget: string, required: false }
              - label: Competition type
                name: competitionType
                widget: select
                options:
                  - { label: Just for fun, value: just-for-fun }
                  - { label: Popular choice, value: popular-choice }
                  - { label: Judged, value: judged }
              - { label: Competition label, name: competitionLabel, widget: hidden }
              - { label: Competition note, name: competitionNote, widget: hidden }
              - { label: Has judge awards, name: hasJudgeAwards, widget: boolean }

  - name: modjam_mods
    label: ModJam Mods
    label_singular: ModJam Mod
    description: One source file per ModJam submission. Public event-grouped data is generated during deployment.
    folder: content/modjam/mods
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.eventId}}-{{slug}}"
    summary: "{{eventId}} · {{title}}"
    editor: { preview: false }
    fields:
      - label: Stable event ID
        name: eventId
        widget: string
        hint: Must match an event ID in the ModJam Events document, such as summer-2026.
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
      - label: Stable entry ID
        name: id
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
      - { label: Mod title, name: title, widget: string }
      - { label: Mod URL, name: url, widget: string, required: false }
      - label: Authors
        name: authors
        widget: list
        label_singular: Author
        allow_reorder: false
        fields:
          - label: Modder
            name: id
            widget: registry_modder
            registry_value: id
      - label: Themes
        name: themes
        widget: list
        label_singular: Theme
        allow_reorder: false
        field: { label: Theme, name: theme, widget: string }
      - { label: Category, name: category, widget: string }
      - label: Placement key
        name: placement
        widget: select
        required: false
        options:
          - { label: First, value: first }
          - { label: Runner-up, value: runner-up }
          - { label: Third, value: third }
          - { label: Popular choice, value: popular-choice }
      - { label: Placement label, name: placementLabel, widget: string, required: false }
      - label: Judge awards
        name: awards
        widget: list
        label_singular: Award
        allow_reorder: false
        required: false
        field: { label: Award, name: award, widget: string }
      - { label: Award placard URL or path, name: awardPlacardUrl, widget: image_path, required: false }
      - { label: Nexus image, name: pictureUrl, widget: hidden, required: false }

  - name: modjam_postcards
    label: ModJam Postcards
    label_singular: ModJam Postcard
    description: One source file per postcard. The matching full-size and thumbnail WebP files keep the same image filename.
    folder: content/modjam/postcards
    create: true
    delete: false
    extension: json
    format: json
    identifier_field: file
    slug: "{{slug}}"
    summary: "{{file}}"
    editor: { preview: false }
    fields:
      - label: Image filename
        name: file
        widget: string
        hint: Relative to modjam/assets/postcards/full and thumbnail.
      - label: ModJam entry
        name: entryId
        widget: archive_mod
        archive_source: modjam
      - { label: Caption, name: caption, widget: string, required: false }
      - label: Caption position
        name: captionPosition
        widget: select
        required: false
        options:
          - { label: Upper left, value: upper-left }
          - { label: Lower right, value: lower-right }
