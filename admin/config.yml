  - name: modathon_achievements
    label: Modathon Achievements
    label_singular: Modathon Achievement Year
    description: Achievement definitions and unlockers are stored in one file per year.
    format: json
    delete: false
    editor:
      preview: false
    files:
      - label: "2015 achievements"
        name: achievements_2015
        file: modathon/assets/data/2015-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2015
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2015 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields: &achievement_fields
              - label: Internal achievement ID
                name: id
                widget: string
                hint: Stable lowercase ID used by image filenames and historical data. Do not change it casually.
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers, and single hyphens only.']
              - label: Public achievement name
                name: name
                widget: string
              - label: Requirement
                name: requirement
                widget: text
              - label: Mastery name
                name: masteryName
                widget: string
                required: false
                hint: Optional historical mastery label.
              - label: Public rarity label
                name: rarity
                widget: select
                required: false
                hint: Some historical achievements intentionally have no rarity label.
                options:
                  - Bronze
                  - Challenge
                  - Challenge/Super
                  - Category
                  - Copper
                  - Gold
                  - Hidden
                  - Hidden / Gold
                  - Hidden / Silver
                  - Hidden/Copper
                  - Hidden/Silver
                  - Hidden/Super
                  - Metrics
                  - Ruby
                  - Silver
                  - Updated Mod Badge
              - label: Rarity key
                name: rarityKey
                widget: select
                hint: Internal styling key. Keep it consistent with the public rarity label.
                options:
                  - bronze
                  - challenge
                  - challenge-super
                  - category
                  - copper
                  - gold
                  - hidden
                  - hidden-copper
                  - hidden-gold
                  - hidden-silver
                  - hidden-super
                  - metrics
                  - ruby
                  - silver
                  - unspecified
                  - updated-mod-badge
              - label: Display group
                name: group
                widget: select
                hint: Internal grouping used by achievement filters and styling.
                options:
                  - badge
                  - category
                  - challenge
                  - challenge-super
                  - hidden
                  - hidden-metal
                  - hidden-super
                  - metal
                  - metric
                  - standard
              - label: Badge image
                name: imageUrl
                widget: image
                required: false
                choose_url: true
                hint: Existing badge paths are relative to /modathon/. New uploads use /assets/images/uploads/ and work on both hosted sites.
                media_library:
                  config:
                    max_file_size: 5242880
              - label: Unlocked by
                name: unlockedBy
                widget: list
                label_singular: Modder
                allow_reorder: false
                hint: Store the exact public names expected by the website. Historical unlockers are not limited to the Modders collection.
                field:
                  label: Modder name
                  name: modder
                  widget: string
              - label: Unlock count
                name: unlockedCount
                widget: number
                value_type: int
                min: 0
                hint: Must equal the number of names in “Unlocked by.” Existing import scripts calculate this value.
      - label: "2016 achievements"
        name: achievements_2016
        file: modathon/assets/data/2016-achievements.json
        fields:
          - { label: Schema version, name: schemaVersion, widget: hidden, default: 1 }
          - label: Event
            name: event
            widget: object
            collapsed: true
            summary: Morrowind Modathon 2016
            fields:
              - { label: Event name, name: name, widget: hidden, default: Morrowind Modathon }
              - { label: Event year, name: year, widget: hidden, default: 2016 }
          - label: Achievements
            name: achievements
            widget: list
            label_singular: Achievement
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            allow_remove: false
            allow_reorder: false
            fields: *achievement_fields
      - label: "2017 achievements"
