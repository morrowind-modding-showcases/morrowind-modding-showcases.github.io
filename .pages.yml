# Pages CMS edits hand-maintained source records in place.
# Public map JSON is generated from the wiki Markdown during the site build.
media:
  input: assets/images/uploads
  output: /assets/images/uploads
  categories:
    - image
  rename: safe

settings:
  content:
    merge: true

content:
  - name: modders_group
    label: Modders
    type: group
    items:
      - name: modders
        label: Modders
        description: Site-wide modder profiles. Existing files cannot be renamed or deleted.
        type: collection
        path: content/modders
        format: json
        subfolders: false
        filename: "{fields.id}.json"
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - name
          primary: name
          sort:
            - name
          search:
            - name
            - id
            - aliases
          default:
            sort: name
            order: asc
        fields:
          - name: id
            label: Stable modder ID
            type: string
            required: true
            description: Used by event records and as the filename for new profiles.
            pattern:
              regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: Use lowercase letters, numbers, and single hyphens only.
          - name: name
            label: Public name
            type: string
            required: true
          - name: nexusProfileUrl
            label: Nexus profile URL
            type: string
            required: false
          - name: avatarUrl
            label: Avatar URL or path
            type: string
            required: false
          - name: aliases
            label: Historical aliases
            type: string
            list: true
            required: false
            description: Keep previous public names here so historical credits still resolve.

  - name: modathon_group
    label: Modathon
    type: group
    items:
      - name: modathon_mods
        label: Mods
        description: One JSON source file per Modathon submission. Open the matching year folder before adding a mod.
        type: collection
        path: content/modathon/mods
        format: json
        subfolders: true
        filename:
          template: "{fields.year}-{primary}.json"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - name
            - year
            - category
          primary: name
          sort:
            - year
            - name
          search:
            - name
            - authors.name
            - category
          default:
            sort: year
            order: desc
        fields:
          - name: year
            label: Year
            type: number
            required: true
          - name: name
            label: Public mod name
            type: string
            required: true
          - name: authors
            label: Authors
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{name}"
            required: true
            fields:
              - name: name
                label: Author
                type: reference
                required: true
                options:
                  collection: modders
                  search: "name,id,aliases"
                  value: "{fields.name}"
                  label: "{fields.name}"
              - name: contributed
                label: Directly contributed
                type: boolean
                required: true
                default: true
                description: Turn this off when the author is credited but did not directly work on this Modathon submission.
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - Character Customization
                - Dungeon
                - Gameplay, Patch, or UI
                - Graphics, Animations, or Audio
                - Immersion
                - Items
                - Landscape or Landmass
                - NPCs and Creatures
                - Player Home
                - Quests
                - Resource or Utility
                - Towns and Cities
                - Unknown
          - name: url
            label: Mod URL
            type: string
            required: true
          - name: showcaseUrl
            label: Showcase URL
            type: string
            required: false
            description: Optional. Paste a YouTube watch or youtu.be URL; timestamped short links may use ?t= or &t=.
            pattern:
              regex: "^(?:$|https://(?:(?:www\\.|m\\.)?youtube\\.com/watch\\?(?:[^\\s#]*&)?v=[A-Za-z0-9_-]{11}(?:[&#][^\\s]*)?|youtu\\.be/[A-Za-z0-9_-]{11}(?:[?&][^\\s]*)?))$"
              message: "Leave this blank or paste a valid HTTPS YouTube watch or youtu.be URL."

      - name: modathon_achievements
        label: Achievements
        description: One achievement per JSON file in its matching year folder.
        type: collection
        path: content/modathon/achievements
        format: json
        subfolders: true
        filename: "{fields.year}-{fields.id}.json"
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - name
            - year
            - rarity
          primary: name
          sort:
            - year
            - name
            - rarity
          search:
            - name
            - id
            - requirement
            - unlockedBy
          default:
            sort: year
            order: desc
        fields:
          - name: schemaVersion
            label: Schema version
            type: number
            readonly: true
            required: true
            default: 1
          - name: year
            label: Year
            type: number
            required: true
          - name: id
            label: Stable achievement ID
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: Use lowercase letters, numbers, and single hyphens only.
          - name: name
            label: Achievement name
            type: string
            required: true
          - name: requirement
            label: Requirement
            type: text
            required: true
          - name: masteryName
            label: Mastery name
            type: string
            required: false
          - name: rarity
            label: Rarity
            type: select
            required: false
            options:
              values:
                - Bronze
                - Challenge
                - Challenge/Super
                - Category
                - Copper
                - Gold
                - Hidden
                - Hidden / Gold
                - Hidden / Silver
                - Hidden/Copper
                - Hidden/Silver
                - Hidden/Super
                - Metrics
                - Ruby
                - Silver
                - Updated Mod Badge
          - name: rarityKey
            label: Rarity key
            type: select
            required: true
            options:
              values:
                - bronze
                - challenge
                - challenge-super
                - category
                - copper
                - gold
                - hidden
                - hidden-copper
                - hidden-gold
                - hidden-silver
                - hidden-super
                - metrics
                - ruby
                - silver
                - unspecified
                - updated-mod-badge
          - name: group
            label: Display group
            type: select
            required: true
            options:
              values:
                - badge
                - category
                - challenge
                - challenge-super
                - hidden
                - hidden-metal
                - hidden-super
                - metal
                - metric
                - standard
          - name: imageUrl
            label: Badge image URL or path
            type: string
            required: false
          - name: unlockedBy
            label: Unlocked by
            type: reference
            required: false
            description: Select one or more public modder names from the central registry.
            options:
              collection: modders
              multiple: true
              search: "name,id,aliases"
              value: "{fields.name}"
              label: "{fields.name}"
          # unlockedCount is derived and intentionally omitted; merge mode preserves it.

      - name: modathon_events
        label: Events
        description: One source file per Modathon. Event names are generated from the year.
        type: collection
        path: content/modathon/events
        format: json
        subfolders: false
        filename: "{fields.year}.json"
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - year
          primary: year
          sort:
            - year
          search:
            - year
          default:
            sort: year
            order: desc
        fields:
          - name: schemaVersion
            label: Schema version
            type: number
            hidden: true
            required: true
            default: 1
          - name: eventType
            label: Event type
            type: string
            hidden: true
            required: true
            default: modathon
          - name: year
            label: Year
            type: number
            required: true
          - name: timezoneLabel
            label: Timezone label
            type: string
            hidden: true
            required: true
            default: UTC
          - name: countdown
            label: Countdown
            type: object
            required: true
            fields:
              - name: start
                label: Modathon begins
                type: date
                required: true
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: end
                label: Main deadline
                type: date
                required: true
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: graceEnd
                label: Grace period ends
                type: date
                required: true
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: reset
                label: Countdown resets
                type: date
                required: true
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
          - name: note
            label: Note
            type: text
            required: false
          - name: individualModCards
            label: Individual mod cards
            type: boolean
            required: false
          - name: awards
            label: Awards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{award}"
            required: false
            fields:
              - name: award
                label: Award
                type: string
                required: true
              - name: mods
                label: Winning mods
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                required: false
                fields:
                  - name: name
                    label: Winning mod name
                    type: string
                    required: true
                    description: Kept as a string because award lookups are year-scoped.
                  - name: attribution
                    label: Attribution
                    type: string
                    list: true
                    required: true
                    description: Public names are stored exactly as historical strings.
                  - name: archiveName
                    label: Archive lookup name
                    type: string
                    required: false

  - name: madness_group
    label: Madness
    type: group
    items:
      - name: madness_events
        label: Events
        description: One structured JSON file per Madness event.
        type: collection
        path: content/madness/events
        format: json
        subfolders: false
        filename: "{fields.year}.json"
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - year
            - season
          primary: year
          sort:
            - year
            - season
          search:
            - year
            - season
            - themes.name
          default:
            sort: year
            order: desc
        fields:
          - name: schemaVersion
            label: Schema version
            type: number
            hidden: true
            required: true
            default: 1
          - name: eventType
            label: Event type
            type: string
            hidden: true
            required: true
            default: madness
          - name: year
            label: Year
            type: number
            required: true
          - name: season
            label: Season
            type: number
            required: true
          - name: themes
            label: Themes
            type: object
            list:
              collapsible: false
            required: false
            description: Add, remove, or edit week themes here. Empty events still provide an Add item control.
            fields:
              - name: id
                label: Stable theme ID
                type: string
                required: true
              - name: name
                label: Theme name
                type: string
                required: true
              - name: weekStart
                label: First week
                type: number
                required: true
              - name: weekEnd
                label: Last week
                type: number
                required: true
          - name: countdown
            label: Countdown
            type: object
            required: false
            fields:
              - name: registrationOpen
                label: Registration opens
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: competitionStart
                label: Competition starts
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: submissionsClose
                label: Submissions close
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: bugFixEnd
                label: Bug-fixing ends
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
          - name: registrationFormId
            label: Registration form ID
            type: string
            required: false

      - name: madness_mods
        label: Mods
        description: One JSON source file per Madness submission. Open the matching year folder before adding a mod.
        type: collection
        path: content/madness/mods
        format: json
        subfolders: true
        filename:
          template: "{fields.year}-{primary}.json"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - name
            - year
            - category
          primary: name
          sort:
            - year
            - name
          search:
            - name
            - team
            - category
            - themeId
          default:
            sort: year
            order: desc
        fields:
          - name: year
            label: Year
            type: number
            required: true
          - name: name
            label: Mod name
            type: string
            required: true
          - name: url
            label: Mod URL
            type: string
            required: false
          - name: showcaseUrl
            label: Showcase URL
            type: string
            required: false
            description: Optional. Paste a YouTube watch or youtu.be URL; timestamped short links may use ?t= or &t=.
            pattern:
              regex: "^(?:$|https://(?:(?:www\\.|m\\.)?youtube\\.com/watch\\?(?:[^\\s#]*&)?v=[A-Za-z0-9_-]{11}(?:[&#][^\\s]*)?|youtu\\.be/[A-Za-z0-9_-]{11}(?:[?&][^\\s]*)?))$"
              message: "Leave this blank or paste a valid HTTPS YouTube watch or youtu.be URL."
          - name: team
            label: Team
            type: reference
            required: false
            options:
              collection: madness_teams
              search: "name,year"
              value: "Team {fields.name}"
              label: "{fields.year} · {fields.name}"
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - Character Customization
                - Dungeon
                - Gameplay, Patch, or UI
                - Graphics, Animations, or Audio
                - Immersion
                - Items
                - Landscape or Landmass
                - NPCs and Creatures
                - Player Home
                - Quests
                - Resource or Utility
                - Towns and Cities
                - Unknown
          - name: themeId
            label: Theme ID
            type: select
            required: false
            description: Select an ID labeled for the mod's Madness year; validation rejects cross-year themes.
            options:
              values:
                - { name: player-home, label: "2016 · Player Home" }
                - { name: item-mods, label: "2016 · Item Mods" }
                - { name: quest-mods, label: "2016 · Quest Mods" }
                - { name: npc-mods, label: "2016 · NPC Mods" }
                - { name: great-houses, label: "2017 · Great Houses" }
                - { name: dwemer-and-magic, label: "2017 · Dwemer and Magic" }
                - { name: sixth-house-and-solstheim, label: "2017 · Sixth House and Solstheim" }
                - { name: ocean-and-thief, label: "2017 · Ocean and Thief" }
                - { name: sixth-house-and-great-house, label: "2018 · Sixth House and Great House" }
                - { name: ocean-and-religion, label: "2018 · Ocean and Religion" }
                - { name: dungeon-overhaul, label: "2019 · Dungeon Overhaul" }
                - { name: town-overhaul, label: "2019 · Town Overhaul" }
                - { name: daedra-and-legends, label: "2020 · Daedra and Legends" }
                - { name: industry-and-enterprise-and-conflict, label: "2022 · Industry & Enterprise and Conflict" }
                - { name: decay-and-rebirth-and-schools-of-magic, label: "2023 · Decay and Rebirth & Schools of Magic" }
                - { name: transformation-and-skies-and-stars, label: "2024 · Transformation & Skies and Stars" }
                - { name: prophecy-and-myth-and-hunting-and-horrors, label: "2025 · Prophecy and Myth & Hunting and Horrors" }
          - name: place
            label: Place
            type: string
            required: false
          - name: notes
            label: Notes
            type: text
            required: false
          # pictureUrl is generated and intentionally omitted; merge mode preserves it.

      - name: madness_teams
        label: Teams
        description: One JSON source file per Madness team.
        type: collection
        path: content/madness/teams
        format: json
        subfolders: false
        filename:
          template: "{fields.year}-{primary}.json"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - name
            - year
            - place
          primary: name
          sort:
            - year
            - name
          search:
            - name
            - mods.name
            - members.id
          default:
            sort: year
            order: desc
        fields:
          - name: year
            label: Year
            type: number
            required: true
          - name: name
            label: Team name
            type: string
            required: true
          - name: place
            label: Place
            type: string
            required: false
          - name: mods
            label: Mods
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{name}"
            required: true
            fields:
              - name: name
                label: Mod name
                type: string
                required: true
                description: Kept as a string because mod names are scoped to an event year.
          - name: members
            label: Members
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{id}"
            required: true
            fields:
              - name: id
                label: Modder
                type: reference
                required: true
                options:
                  collection: modders
                  search: "name,id,aliases"
                  value: "{fields.id}"
                  label: "{fields.name}"

      - name: madness_score_rules
        label: Score Rules
        description: Point values used to build the shared Madness Score for every profile site.
        type: file
        path: content/madness-score-rules.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: entry
            label: Entry points
            type: object
            required: true
            fields:
              - name: modathon
                label: Modathon entry
                type: number
                required: true
              - name: modjam
                label: ModJam entry
                type: number
                required: true
              - name: madness
                label: Madness entry
                type: number
                required: true
          - name: placement
            label: Placement bonuses
            type: object
            required: true
            fields:
              - name: modathon
                label: Modathon
                type: object
                required: true
                fields:
                  - name: first
                    label: First place
                    type: number
                    required: true
                  - name: second
                    label: Second place
                    type: number
                    required: true
                  - name: third
                    label: Third place
                    type: number
                    required: true
              - name: modjam
                label: ModJam
                type: object
                required: true
                fields:
                  - name: first
                    label: First place
                    type: number
                    required: true
                  - name: second
                    label: Second place
                    type: number
                    required: true
                  - name: third
                    label: Third place
                    type: number
                    required: true
              - name: madness
                label: Madness
                type: object
                required: true
                fields:
                  - name: first
                    label: First place
                    type: number
                    required: true
                  - name: second
                    label: Second place
                    type: number
                    required: true
                  - name: third
                    label: Third place
                    type: number
                    required: true
          - name: modderthlon
            label: Modderthlon bonus
            type: number
            required: true
          - name: achievement
            label: Achievement points
            type: object
            required: true
            fields:
              - name: gold
                label: Gold or Ruby
                type: number
                required: true
              - name: silver
                label: Silver
                type: number
                required: true
              - name: bronze
                label: Bronze or Copper
                type: number
                required: true
              - name: hidden
                label: Hidden
                type: number
                required: true
              - name: challenge
                label: Challenge
                type: number
                required: true
              - name: category
                label: Category
                type: number
                required: true
              - name: metrics
                label: Metrics
                type: number
                required: true
              - name: other
                label: Other
                type: number
                required: true

  - name: modjam_group
    label: ModJam
    type: group
    items:
      - name: modjam_mods
        label: Mods
        description: One JSON source file per ModJam entry. Open the matching event folder before adding a mod.
        type: collection
        path: content/modjam/mods
        format: json
        subfolders: true
        filename:
          template: "{fields.eventId}-{primary}.json"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - title
          primary: title
          sort:
            - title
            - eventId
          search:
            - title
            - id
            - eventId
            - authors.id
          default:
            sort: title
            order: asc
        fields:
          - name: eventId
            label: Event ID
            type: reference
            required: true
            description: Select the ModJam event; free-form IDs are not accepted.
            options:
              collection: modjam_events
              search: "season,year"
              value: "{name}"
              label: "{fields.season} {fields.year}"
          - name: title
            label: Mod title
            type: string
            required: true
          - name: url
            label: Mod URL
            type: string
            required: false
            description: Nexus URLs automatically generate the stable entry ID from their last five digits.
          - name: showcaseUrl
            label: Showcase URL
            type: string
            required: false
            description: Optional. Paste a YouTube watch or youtu.be URL; timestamped short links may use ?t= or &t=.
            pattern:
              regex: "^(?:$|https://(?:(?:www\\.|m\\.)?youtube\\.com/watch\\?(?:[^\\s#]*&)?v=[A-Za-z0-9_-]{11}(?:[&#][^\\s]*)?|youtu\\.be/[A-Za-z0-9_-]{11}(?:[?&][^\\s]*)?))$"
              message: "Leave this blank or paste a valid HTTPS YouTube watch or youtu.be URL."
          - name: authors
            label: Authors
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{id}"
            required: true
            fields:
              - name: id
                label: Modder
                type: reference
                required: true
                options:
                  collection: modders
                  search: "name,id,aliases"
                  value: "{fields.id}"
                  label: "{fields.name}"
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - Character Customization
                - Dungeon
                - Gameplay, Patch, or UI
                - Graphics, Animations, or Audio
                - Immersion
                - Items
                - Landscape or Landmass
                - NPCs and Creatures
                - Player Home
                - Quests
                - Resource or Utility
                - Towns and Cities
                - Unknown
          - name: placement
            label: Placement key
            type: string
            required: false
          - name: placementLabel
            label: Placement label
            type: string
            required: false
          - name: awards
            label: Awards
            type: string
            list: true
            required: false
          - name: awardPlacardUrl
            label: Award placard URL or path
            type: string
            required: false
          # pictureUrl is generated and intentionally omitted; merge mode preserves it.

      - name: modjam_events
        label: Events
        description: One source file per ModJam. Event IDs and public labels are generated from season and year.
        type: collection
        path: content/modjam/events
        format: json
        subfolders: false
        filename: "{fields.season}-{fields.year}.json"
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - season
            - year
          primary: season
          sort:
            - year
            - season
          search:
            - season
            - year
            - themes
          default:
            sort: year
            order: desc
        fields:
          - name: schemaVersion
            label: Schema version
            type: number
            hidden: true
            required: true
            default: 1
          - name: eventType
            label: Event type
            type: string
            hidden: true
            required: true
            default: modjam
          - name: season
            label: Season
            type: select
            required: true
            options:
              values:
                - Winter
                - Spring
                - Summer
                - Autumn
          - name: year
            label: Year
            type: number
            required: true
          - name: themes
            label: Themes
            type: string
            list: true
            required: false
          - name: timezoneLabel
            label: Timezone label
            type: string
            hidden: true
            required: false
          - name: countdown
            label: Countdown
            type: object
            required: false
            fields:
              - name: kickoffStart
                label: Kickoff stream starts
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: start
                label: ModJam starts
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
              - name: end
                label: ModJam ends
                type: date
                required: false
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
          - name: participationBannerUrl
            label: Participation banner URL or path
            type: string
            required: false
          - name: banner
            label: Banner URL or path
            type: string
            required: false
          - name: headers
            label: Header images
            type: string
            list: true
            required: true
          - name: resultsStreamUrl
            label: Results stream URL
            type: string
            required: false
          - name: competitionType
            label: Competition type
            type: select
            required: true
            options:
              values:
                - name: just-for-fun
                  label: Just for fun
                - name: popular-choice
                  label: Popular choice
                - name: judged
                  label: Judged
          - name: hasJudgeAwards
            label: Has judge awards
            type: boolean
            required: true

      - name: modjam_postcards
        label: Postcards
        description: One JSON source file per postcard.
        type: collection
        path: content/modjam/postcards
        format: json
        subfolders: false
        filename:
          template: "{primary}.json"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - file
            - caption
          primary: file
          sort:
            - file
            - caption
          search:
            - file
            - caption
            - entryId
          default:
            sort: file
            order: asc
        fields:
          - name: file
            label: Image filename
            type: string
            required: true
          - name: entryId
            label: ModJam entry
            type: reference
            required: true
            options:
              collection: modjam_mods
              search: "title,id,eventId"
              value: "{fields.id}"
              label: "{fields.title}"
          - name: caption
            label: Caption
            type: string
            required: false
          - name: captionPosition
            label: Caption position
            type: select
            required: false
            options:
              values:
                - name: upper-left
                  label: Upper left
                - name: lower-right
                  label: Lower right

      - name: modjam_judges
        label: Judges
        description: The existing structured judge registry.
        type: file
        path: modjam/data/judges.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: judges
            label: Judges
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{modderId}"
            required: true
            fields:
              - name: modderId
                label: Modder
                type: reference
                required: true
                options:
                  collection: modders
                  search: "name,id,aliases"
                  value: "{fields.id}"
                  label: "{fields.name}"

  - name: wiki_group
    label: Wiki
    type: group
    items:
      - name: wiki_locations
        label: Locations
        description: Location articles and their TES3 Mod Map geometry. Filenames are stable after creation.
        type: collection
        path: wiki/content/locations
        format: yaml-frontmatter
        subfolders: false
        exclude:
          - index.md
        filename:
          template: "{primary}.md"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - title
            - region
            - map_id
            - draft
          primary: title
          sort:
            - title
          search:
            - title
            - cell
            - region
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Location name
            type: string
            required: true
          - name: map_id
            label: Stable map ID
            type: number
            required: true
            description: Use a positive integer that is not assigned to another location.
          - name: cell
            label: Cell name
            type: string
            required: false
            description: Exact in-game cell name used when matching mods to this marker.
          - name: region
            label: Region
            type: string
            required: false
          - name: x
            label: X coordinate
            type: number
            required: true
          - name: y
            label: Y coordinate
            type: number
            required: true
          - name: icon
            label: Map icon ID
            type: number
            required: true
          - name: level
            label: Map zoom level
            type: number
            required: true
          - name: uesp_wiki
            label: UESP wiki title
            type: string
            required: false
          - name: draft
            label: Draft
            type: boolean
            required: true
            default: true
          - name: body
            label: Location article
            type: rich-text
            options:
              format: markdown
              switcher: true

      - name: wiki_mods
        label: Mods
        description: Wiki articles and TES3 Mod Map metadata. Filenames are stable after creation.
        type: collection
        path: wiki/content/mods
        format: yaml-frontmatter
        subfolders: false
        exclude:
          - index.md
        filename:
          template: "{primary}.md"
          field: create
        operations:
          create: true
          rename: false
          delete: false
        view:
          fields:
            - title
            - map_enabled
            - draft
          primary: title
          sort:
            - title
          search:
            - title
            - authors
            - events
            - tags
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Mod name
            type: string
            required: true
          - name: description
            label: Short description
            type: text
            required: false
            description: The short “About this mod” summary from Nexus Mods.
          - name: authors
            label: Authors
            type: string
            list: true
            required: false
          - name: url
            label: Mod or download URL
            type: string
            required: false
            pattern:
              regex: '^(?:$|https?://[^\s]+)$'
              message: Leave this blank or enter a complete HTTP(S) URL.
          - name: picture_url
            label: Nexus picture URL
            type: string
            required: false
            pattern:
              regex: '^(?:$|https?://[^\s]+)$'
              message: Leave this blank or enter a complete HTTP(S) image URL.
          - name: events
            label: Modding events
            type: string
            list: true
            required: false
            description: Event names such as Morrowind Modathon 2025 or Winter Modjam 2025.
          - name: categories
            label: Categories
            type: select
            required: false
            options:
              multiple: true
              values:
                - "Architecture"
                - "City Overhaul"
                - "Dungeon"
                - "Gameplay"
                - "Landscape"
                - "Quest"
                - "Resource"
          - name: tags
            label: Tags
            type: string
            list: true
            required: false
          - name: map_enabled
            label: Show on TES3 Mod Map
            type: boolean
            required: true
