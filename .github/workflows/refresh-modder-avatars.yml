name: Refresh modder avatars

on:
  push:
    branches:
      - main
    paths:
      - "content/modders/**"
  schedule:
    - cron: "43 5 * * 1" # Mondays at 05:43 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-content-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh avatars for changed modder profiles
        if: github.event_name == 'push'
        run: >-
          node scripts/cache-modder-avatars.mjs
          --changed
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"

      - name: Refresh every Nexus-backed modder avatar
        if: github.event_name != 'push'
        run: node scripts/cache-modder-avatars.mjs --all

      - name: Commit updated avatar cache
        shell: bash
        run: |
          changes="$(git status --short -- assets/data/modder-avatars.json assets/images/modder-avatars)"
          if [[ -z "$changes" ]]; then
            echo "Avatar cache is already current."
            exit 0
          fi

          printf '%s\n' "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/modder-avatars.json assets/images/modder-avatars
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh modder avatars"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Failed to rebase the avatar-cache commit onto origin/main."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "::error::Failed to push the avatar-cache commit after 3 attempts."
          exit 1
