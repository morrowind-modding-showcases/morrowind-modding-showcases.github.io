name: Sync Resource tag choices

on:
  push:
    paths:
      - content/resources/resources.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resource-tags-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh the hosted CMS tag dropdown
        run: node scripts/sync-resource-tag-options.mjs

      - name: Commit updated tag choices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git diff --cached --quiet || git commit -m "content(sync): Resource tag choices"
          git push
