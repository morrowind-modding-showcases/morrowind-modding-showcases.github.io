name: Create wiki submission PR

on:
  workflow_dispatch:
    inputs:
      encoded_submission:
        description: Validated gzip/base64url wiki submission envelope
        required: true
        type: string
      submission_id:
        description: Submission UUID used for concurrency and branch naming
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wiki-submission-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate submission identifier
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          if [[ ! "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "submission_id must be a UUID." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.WIKI_IMPORT_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install site, wiki, and Worker dependencies
        run: |
          npm ci
          npm ci --prefix wiki
          npm ci --prefix workers/wiki-submissions

      - name: Decode, validate, and apply submission
        id: import
        env:
          WIKI_SUBMISSION_PAYLOAD: ${{ inputs.encoded_submission }}
          EXPECTED_SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          result_file="$RUNNER_TEMP/wiki-submission-result.json"
          node scripts/import-wiki-submission.mjs --output "$result_file"
          changed_path="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.repositoryPath)" "$result_file")"
          contribution_path="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.contributionPath)" "$result_file")"
          pr_title="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.title)" "$result_file")"
          pr_body="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.body)" "$result_file")"
          decoded_submission_id="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.submissionId)" "$result_file")"
          if [[ "$decoded_submission_id" != "$EXPECTED_SUBMISSION_ID" ]]; then
            echo "The dispatch identifier does not match the validated payload." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "changed_path=$changed_path" >> "$GITHUB_OUTPUT"
          echo "contribution_path=$contribution_path" >> "$GITHUB_OUTPUT"
          echo "pr_title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "pr_body=$pr_body" >> "$GITHUB_OUTPUT"

      - name: Verify exactly two intended contribution files changed
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          CONTRIBUTION_PATH: ${{ steps.import.outputs.contribution_path }}
        run: |
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//')
          contains_path() {
            local needle="$1"
            shift
            local candidate
            for candidate in "$@"; do
              [[ "$candidate" == "$needle" ]] && return 0
            done
            return 1
          }
          if [[ "${#changed[@]}" -ne 2 ]] \
            || ! contains_path "$EXPECTED_PATH" "${changed[@]}" \
            || ! contains_path "$CONTRIBUTION_PATH" "${changed[@]}"; then
            echo "Importer changed files outside the permitted wiki page and contribution record."
            echo "Actual changed paths:"
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "  (none)"
            else
              printf '  - %s\n' "${changed[@]}"
            fi
            echo "Importer scope check failed: expected exactly the intended wiki page and contribution record. See the step log for the actual paths." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve intended contribution files
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          CONTRIBUTION_PATH: ${{ steps.import.outputs.contribution_path }}
        run: |
          preserved_file="$RUNNER_TEMP/intended-wiki-submission.md"
          preserved_contribution="$RUNNER_TEMP/intended-wiki-contribution.json"
          cp -- "$EXPECTED_PATH" "$preserved_file"
          cp -- "$CONTRIBUTION_PATH" "$preserved_contribution"
          echo "PRESERVED_FILE=$preserved_file" >> "$GITHUB_ENV"
          echo "PRESERVED_CONTRIBUTION=$preserved_contribution" >> "$GITHUB_ENV"

      - name: Run normal validation and builds
        run: |
          npm run content:validate
          npm run content:build
          npm run content:check
          npm run validate:wiki
          npm test
          npm test --prefix workers/wiki-submissions
          npm run build:site

      - name: Restore only the intended contribution changes
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          CONTRIBUTION_PATH: ${{ steps.import.outputs.contribution_path }}
        run: |
          echo "Repository changes produced during validation:"
          git status --short
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$(dirname "$EXPECTED_PATH")"
          mkdir -p "$(dirname "$CONTRIBUTION_PATH")"
          cp -- "$PRESERVED_FILE" "$EXPECTED_PATH"
          cp -- "$PRESERVED_CONTRIBUTION" "$CONTRIBUTION_PATH"

      - name: Recheck change scope after validation
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          CONTRIBUTION_PATH: ${{ steps.import.outputs.contribution_path }}
        run: |
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//')
          contains_path() {
            local needle="$1"
            shift
            local candidate
            for candidate in "$@"; do
              [[ "$candidate" == "$needle" ]] && return 0
            done
            return 1
          }
          if [[ "${#changed[@]}" -ne 2 ]] \
            || ! contains_path "$EXPECTED_PATH" "${changed[@]}" \
            || ! contains_path "$CONTRIBUTION_PATH" "${changed[@]}"; then
            echo "Validation cleanup left an unexpected tracked or untracked repository change."
            echo "Actual changed paths:"
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "  (none)"
            else
              printf '  - %s\n' "${changed[@]}"
            fi
            echo "Post-validation scope check failed: expected exactly the intended wiki page and contribution record. See the step log for the actual paths." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit the intended contribution files
        id: branch
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          CONTRIBUTION_PATH: ${{ steps.import.outputs.contribution_path }}
          PR_TITLE: ${{ steps.import.outputs.pr_title }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          branch="wiki-submission-${SUBMISSION_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$EXPECTED_PATH" "$CONTRIBUTION_PATH"
          mapfile -t staged < <(git diff --cached --name-only)
          contains_path() {
            local needle="$1"
            shift
            local candidate
            for candidate in "$@"; do
              [[ "$candidate" == "$needle" ]] && return 0
            done
            return 1
          }
          if [[ "${#staged[@]}" -ne 2 ]] \
            || ! contains_path "$EXPECTED_PATH" "${staged[@]}" \
            || ! contains_path "$CONTRIBUTION_PATH" "${staged[@]}"; then
            echo "Staging did not contain exactly the intended wiki page and contribution record." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "$PR_TITLE"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push branch and create public pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.WIKI_IMPORT_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_TITLE: ${{ steps.import.outputs.pr_title }}
          PR_BODY: ${{ steps.import.outputs.pr_body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "$BRANCH"
          pr_url="$(gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" --title "$PR_TITLE" --body "$PR_BODY")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report a safe failure summary
        if: failure()
        run: |
          echo "The wiki submission did not produce a pull request. Review the failed step without printing or copying the encoded submission input." >> "$GITHUB_STEP_SUMMARY"
