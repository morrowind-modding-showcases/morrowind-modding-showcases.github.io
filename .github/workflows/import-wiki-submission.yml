name: Import wiki submission

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved private moderation-queue issue number
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate issue number
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "issue_number must be a positive integer." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.WIKI_IMPORT_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install site, wiki, and Worker dependencies
        run: |
          npm ci
          npm ci --prefix wiki
          npm ci --prefix workers/wiki-submissions

      - name: Retrieve, validate, and apply reviewed submission
        id: import
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WIKI_QUEUE_TOKEN: ${{ secrets.WIKI_QUEUE_TOKEN }}
        run: |
          result_file="$RUNNER_TEMP/wiki-submission-result.json"
          node scripts/import-wiki-submission.mjs "$ISSUE_NUMBER" --output "$result_file"
          changed_path="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.repositoryPath)" "$result_file")"
          pr_title="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.title)" "$result_file")"
          pr_body="$(node -e "const r=require(process.argv[1]); process.stdout.write(r.body)" "$result_file")"
          echo "changed_path=$changed_path" >> "$GITHUB_OUTPUT"
          echo "pr_title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "pr_body=$pr_body" >> "$GITHUB_OUTPUT"

      - name: Verify exactly one intended wiki file changed
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
        run: |
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//')
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$EXPECTED_PATH" ]]; then
            echo "Importer changed files outside its single permitted wiki target."
            echo "Actual changed paths:"
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "  (none)"
            else
              printf '  - %s\n' "${changed[@]}"
            fi
            echo "Importer scope check failed: expected exactly one changed path matching the intended wiki target. See the step log for the actual paths." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve intended wiki file
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
        run: |
          preserved_file="$RUNNER_TEMP/intended-wiki-submission.md"
          cp -- "$EXPECTED_PATH" "$preserved_file"
          echo "PRESERVED_FILE=$preserved_file" >> "$GITHUB_ENV"

      - name: Run normal validation and builds
        run: |
          npm run content:validate
          npm run content:build
          npm run content:check
          npm run validate:wiki
          npm test
          npm test --prefix workers/wiki-submissions
          npm run build:site

      - name: Restore only the intended wiki change
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
        run: |
          echo "Repository changes produced during validation:"
          git status --short
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$(dirname "$EXPECTED_PATH")"
          cp -- "$PRESERVED_FILE" "$EXPECTED_PATH"

      - name: Recheck change scope after validation
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
        run: |
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//')
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$EXPECTED_PATH" ]]; then
            echo "Validation cleanup left an unexpected tracked or untracked repository change."
            echo "Actual changed paths:"
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "  (none)"
            else
              printf '  - %s\n' "${changed[@]}"
            fi
            echo "Post-validation scope check failed: expected exactly one changed path matching the intended wiki target. See the step log for the actual paths." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit the intended wiki file
        id: branch
        env:
          EXPECTED_PATH: ${{ steps.import.outputs.changed_path }}
          PR_TITLE: ${{ steps.import.outputs.pr_title }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          branch="wiki-submission-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$EXPECTED_PATH"
          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != "$EXPECTED_PATH" ]]; then
            echo "Staging did not contain exactly the intended wiki file." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "$PR_TITLE"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push branch and create public pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.WIKI_IMPORT_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_TITLE: ${{ steps.import.outputs.pr_title }}
          PR_BODY: ${{ steps.import.outputs.pr_body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "$BRANCH"
          pr_url="$(gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" --title "$PR_TITLE" --body "$PR_BODY")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Update private moderation issue
        env:
          GH_TOKEN: ${{ secrets.WIKI_QUEUE_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh api --method POST "/repos/morrowind-modding-showcases/wiki-submissions/issues/${ISSUE_NUMBER}/comments" -f body="Imported in ${PR_URL}"
          gh api --method DELETE "/repos/morrowind-modding-showcases/wiki-submissions/issues/${ISSUE_NUMBER}/labels/pending"
          gh api --method POST "/repos/morrowind-modding-showcases/wiki-submissions/issues/${ISSUE_NUMBER}/labels" -f 'labels[]=imported'

      - name: Report a safe failure summary
        if: failure()
        run: |
          echo "The wiki submission was not imported. No imported label was added by this run. Review the failed step without copying private issue content into public logs or pull requests." >> "$GITHUB_STEP_SUMMARY"
