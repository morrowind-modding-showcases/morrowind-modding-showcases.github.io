name: Validate site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install site, wiki, and Worker dependencies
        run: |
          npm ci
          npm ci --prefix wiki
          npm ci --prefix workers/wiki-submissions

      - name: Build and validate content
        run: |
          npm run content:validate
          npm run content:build
          npm run content:check
          npm run validate:wiki
          npm test
          npm test --prefix workers/wiki-submissions
          npm run build:site
