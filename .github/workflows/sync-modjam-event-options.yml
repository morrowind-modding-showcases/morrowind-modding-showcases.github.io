name: Sync CMS Modjam event choices

on:
  push:
    paths:
      - content/modjam/events/*.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-modjam-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install content tools
        run: npm ci

      - name: Refresh the hosted CMS Modjam event choices
        run: npm run cms:sync-modjam-events

      - name: Commit updated event choices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git diff --cached --quiet || git commit -m "content(sync): CMS Modjam event choices"
          git push
