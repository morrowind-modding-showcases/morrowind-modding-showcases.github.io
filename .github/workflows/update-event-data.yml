name: Sync site data from Google Sheets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish syncs public rows; draft also includes unfinished rows for review
        required: true
        default: publish
        type: choice
        options:
          - publish
          - draft
      allow_removals:
        description: Allow workbook-owned events to contain fewer entries, achievements, or teams
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: sync-publishing-workbook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly

      - name: Export publishing tabs
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          PUBLISHING_SPREADSHEET_ID: ${{ secrets.PUBLISHING_SPREADSHEET_ID }}
        run: node scripts/export-google-publishing.mjs --output "$RUNNER_TEMP/publishing"

      - name: Build current compatibility JSON
        run: npm run content:build

      - name: Validate import
        env:
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          args=("$RUNNER_TEMP/publishing" --mode "$MODE" --dry-run)
          if [[ "$ALLOW_REMOVALS" == "true" ]]; then args+=(--allow-removals); fi
          node scripts/import-publishing.mjs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/import-summary.txt"

      - name: Generate site data
        env:
          ALLOW_REMOVALS: ${{ inputs.allow_removals }}
          MODE: ${{ inputs.mode }}
        run: |
          args=("$RUNNER_TEMP/publishing" --mode "$MODE")
          if [[ "$ALLOW_REMOVALS" == "true" ]]; then args+=(--allow-removals); fi
          node scripts/import-publishing.mjs "${args[@]}"

      - name: Synchronize editable record sources
        run: |
          npm run content:sync-generated
          npm run content:build

      - name: Validate generated site
        run: |
          npm run content:check
          npm test

      - name: Check for generated changes
        id: changes
        run: |
          if git diff --quiet -- \
            content \
            modathon/assets/data/modathon-event.json \
            ':(glob)modathon/assets/data/*-achievements.json' \
            modjam/data/modjam-event.json \
            modjam/data/modjam-mods.json \
            modjam/data/modders.json \
            madness/data/madness-event.json \
            madness/data/madness-teams.json \
            madness/data/madness-mods.json \
            madness/data/modders.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated site changes were needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated changes
        if: steps.changes.outputs.changed == 'true'
        id: publish-branch
        run: |
          branch="publishing/workbook-sync-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            content \
            modathon/assets/data/modathon-event.json \
            ':(glob)modathon/assets/data/*-achievements.json' \
            modjam/data/modjam-event.json \
            modjam/data/modjam-mods.json \
            modjam/data/modders.json \
            madness/data/madness-event.json \
            madness/data/madness-teams.json \
            madness/data/madness-mods.json \
            madness/data/modders.json
          git commit -m "Sync site data from publishing workbook"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.publish-branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "Generated from the private publishing workbook."
            echo
            echo "- Import mode: \`$MODE\`"
            echo
            echo "### Import summary"
            echo '```text'
            cat "$RUNNER_TEMP/import-summary.txt"
            echo '```'
            echo
            echo "The full site test suite passed before this pull request was opened."
          } > "$RUNNER_TEMP/pull-request-body.md"

          url=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Sync site data from publishing workbook" \
            --body-file "$RUNNER_TEMP/pull-request-body.md")
          echo "Review pull request: $url" >> "$GITHUB_STEP_SUMMARY"
