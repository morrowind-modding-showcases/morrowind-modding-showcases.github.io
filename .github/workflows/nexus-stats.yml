name: Refresh Nexus stats

# Pulls Nexus metadata once for every unique Nexus-hosted mod across Modathon,
# Modjam, and Madness. All source records are updated individually; public
# compatibility files are rebuilt only for validation and deployment.

on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-content-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install validation dependencies
        run: npm ci

      - name: Fetch mod metadata from Nexus API
        run: node scripts/fetch-nexus-stats.mjs
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_REPORT_PATH: ${{ runner.temp }}/nexus-refresh-report.json

      # Keep per-entry HTTP/image outcomes even if validation blocks the commit.
      - name: Save Nexus refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-refresh-report
          path: ${{ runner.temp }}/nexus-refresh-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build public compatibility JSON
        run: npm run content:build

      - name: Validate refreshed data and site behavior
        run: |
          npm run content:validate
          npm run content:check
          npm run validate:wiki
          npm test

      - name: Verify wiki files are untouched
        shell: bash
        run: |
          changes="$(git status --short -- wiki)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            echo "::error::Nexus refresh must not modify wiki files"
            exit 1
          fi

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Update Nexus stats"
          git push
