  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="site-shell">
    <header class="hero">
      <img class="hero-art" src="../assets/images/mms.webp" alt="">
      <div class="hero-wash"></div>
      <mms-site-switcher current="news" placement="overlay"></mms-site-switcher>
      <div class="hero-content">
        <img class="hero-logo" src="../assets/images/logo.webp" alt="Dark Elf Modding logo">
        <h1>News</h1>
        <p class="hero-subtitle">Public updates from Morrowind Modding Showcases</p>
      </div>
    </header>

    <main>
      <section class="news-archive" aria-labelledby="news-archive-title">
        <div class="news-panel">
          <div class="news-archive__heading">
            <h2 id="news-archive-title">Latest from Patreon</h2>
            <p>Read each complete post on Patreon.</p>
          </div>
          <div class="news-feed news-feed--archive" data-news-feed aria-live="polite" aria-busy="true">
            <p class="news-loading-label" role="status">Loading news…</p>
            <div class="news-skeleton" aria-hidden="true"></div>
            <div class="news-skeleton" aria-hidden="true"></div>
            <div class="news-skeleton" aria-hidden="true"></div>
            <div class="news-skeleton" aria-hidden="true"></div>
          </div>
          <noscript>
            <p class="news-feed__status">Enable JavaScript to load the latest news.</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <img src="../assets/images/deg.webp" alt="darkelfguy portrait">
        <span>darkelfmodding.com &mdash; Morrowind modding, showcased since 2014</span>
      </div>
    </footer>
  </div>
